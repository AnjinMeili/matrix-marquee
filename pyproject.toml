[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matrix-player"
version = "0.1.0"
description = "Offline-first RGB matrix media player"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
matrix-player = "matrix_player.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_player"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
